<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background hexagon / shield -->
  <polygon points="50,10 88,28 88,68 50,92 12,68 12,28" fill="#111827" stroke="url(#grad)" stroke-width="4" />
  
  <!-- Central Glowing Diamond -->
  <polygon points="50,30 68,50 50,70 32,50" fill="url(#grad)" filter="url(#glow)" opacity="0.9" />
  
  <!-- Particle Sparks -->
  <circle cx="50" cy="22" r="3" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="76" cy="38" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="24" cy="38" r="2.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="68" cy="62" r="2.5" fill="#ec4899" filter="url(#glow)" />
  <circle cx="32" cy="62" r="2.5" fill="#f59e0b" filter="url(#glow)" />
</svg>
